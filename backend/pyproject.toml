[project]
name = "langchain-supabase-ingestor"
version = "1.0.0"
description = "LangChain + Supabase real-time data ingestion and alerting system"
requires-python = ">=3.11"

dependencies = [
    # Supabase
    "supabase>=2.4.0",
    "realtime>=2.0.0",

    # LangChain core
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",

    # HTTP
    "httpx>=0.27.0",

    # Data parsing
    "jmespath>=1.0.1",
    "pydantic>=2.7.0",

    # ML / vector math
    "numpy>=1.26.0",

    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Scheduling
    "apscheduler>=3.10.4",

    # Config
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
