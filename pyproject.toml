[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fda-recall-monitor"
version = "0.1.0"
description = "An agent that polls openFDA recall/enforcement endpoints, deduplicates records, and logs structured results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "FDA Recall Monitor" }]
keywords = ["fda", "recall", "monitoring", "openFDA", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "aiosqlite>=0.20.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
]

[project.scripts]
fda-monitor = "cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
